# Dependabot-Konfiguration für das LogWatch Dashboard
#
# Dependabot prüft regelmäßig die Abhängigkeiten und erstellt
# Pull-Requests mit Aktualisierungen. Zusammengeführt wird NICHTS
# automatisch – jede Aktualisierung kommt als PR und wird von dir
# geprüft und bestätigt. Sicherheits-Updates (bekannte Schwachstellen)
# werden zusätzlich automatisch als PR eröffnet, sobald diese Datei
# vorhanden ist.

version: 2
updates:
  # 1) Python-Abhängigkeiten (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-abhaengigkeiten:
        patterns:
          - "*"

  # 2) GitHub-Actions (Workflows unter .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
