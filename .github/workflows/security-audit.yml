name: Security-Audit

# Prüft die Python-Abhängigkeiten auf bekannte Sicherheitslücken (pip-audit).
# Läuft bei jedem Push/PR sowie wöchentlich, damit neu bekannt gewordene
# Schwachstellen auch ohne Code-Änderung auffallen.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit installieren
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Abhängigkeiten auditieren
        run: pip-audit -r requirements.txt --strict
