# LogWatch Dashboard – nginx vhost
# Öffentliche URL: https://logwatch-dash.abacusai.cloud  ->  server_name logwatch-dash.vm.internal
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name logwatch-dash.vm.internal;

    # Uploads von Logdateien erlauben (großzügig bemessen).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Iframe-Preview auf apps.abacus.ai erlauben (kein X-Frame-Options setzen).
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;
        # Redeploys zeitnah sichtbar machen.
        add_header Cache-Control "max-age=0, s-maxage=60" always;
    }
}
